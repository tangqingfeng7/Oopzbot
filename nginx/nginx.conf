# Oopz Bot 反向代理站点配置
# 裸机部署：复制到 /etc/nginx/sites-available/oopzbot，然后 ln -s 到 sites-enabled
# Docker Compose 使用同目录下独立的 nginx.docker.conf。

upstream bot_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# === HTTP (80) → 301 HTTPS ===
server {
    listen 80;
    server_name traceck.online;
    return 301 https://$host$request_uri;
}

# === HTTPS (443) ===
server {
    # `http2 on` 仅支持 Nginx >= 1.25.1；此写法同时兼容旧版系统包。
    listen 443 ssl http2;
    server_name traceck.online;

    # --- TLS ---
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- 安全头 ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
    gzip_vary on;

    # --- 公共代理头 ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 公网播放器域名默认隐藏管理后台，返回 404（不暴露后台存在）。
    # 保留 /admin-assets/admin-shell.css 与背景图，避免影响屏幕共享插件页面样式。
    location ~ ^/admin(/|$) {
        return 404;
    }

    location ^~ /admin-assets/bundle/ {
        return 404;
    }

    location = /admin-assets/admin-shell-template.html {
        return 404;
    }

    location / {
        proxy_pass http://bot_backend;
    }
}

