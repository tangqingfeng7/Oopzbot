services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
      netease-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      edge:
        ipv4_address: "${BOT_NGINX_IP:-172.30.255.2}"
      backend:
        ipv4_address: "${BOT_NGINX_BACKEND_IP:-172.30.254.5}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      backend:
        ipv4_address: "${BOT_REDIS_IP:-172.30.254.2}"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BOT_UID: "${BOT_UID:-1000}"
        BOT_GID: "${BOT_GID:-1000}"
    init: true
    restart: unless-stopped
    # 应覆盖 20 秒应用关停预算，并为容器调度和退出留出余量。
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      netease-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      BOT_REDIS_HOST: "${BOT_REDIS_HOST:-redis}"
      BOT_REDIS_PORT: "${BOT_REDIS_PORT:-6379}"
      BOT_REDIS_PASSWORD: "${BOT_REDIS_PASSWORD:-}"
      BOT_REDIS_DB: "${BOT_REDIS_DB:-0}"
      BOT_NETEASE_BASE_URL: "${BOT_NETEASE_BASE_URL:-http://netease-api:3000}"
      # Compose 的 Nginx 与健康检查固定连接容器内 8080 端口。
      BOT_WEB_HOST: "0.0.0.0"
      BOT_WEB_PORT: "8080"
      BOT_WEB_TRUSTED_PROXY_CIDRS: "${BOT_NGINX_IP:-172.30.255.2}/32,${BOT_NGINX_BACKEND_IP:-172.30.254.5}/32"
      BOT_REDIS_CONNECT_TIMEOUT: "${BOT_REDIS_CONNECT_TIMEOUT:-3.0}"
      BOT_REDIS_SOCKET_TIMEOUT: "${BOT_REDIS_SOCKET_TIMEOUT:-5.0}"
      BOT_REDIS_HEALTH_CHECK_INTERVAL: "${BOT_REDIS_HEALTH_CHECK_INTERVAL:-30}"
      BOT_OOPZ_PROXY: "${BOT_OOPZ_PROXY:-direct}"
      # 不设默认值：未配置时保留 config.py，显式空 WS 地址则恢复自动配对。
      BOT_OOPZ_BASE_URL:
      BOT_OOPZ_WS_URL:
      BOT_DISABLE_AUTO_START_NETEASE: "${BOT_DISABLE_AUTO_START_NETEASE:-0}"
      BOT_DISABLE_VOICE: "${BOT_DISABLE_VOICE:-0}"
      BOT_LOG_CONSOLE_LEVEL: "${BOT_LOG_CONSOLE_LEVEL:-INFO}"
      BOT_LOG_FILE_LEVEL: "${BOT_LOG_FILE_LEVEL:-DEBUG}"
    expose:
      - "8080"
    shm_size: "1gb"
    volumes:
      # runtime.py/private_key.py 经镜像内符号链接暴露为 /app/*.py；目录级
      # 挂载允许管理后台在同一文件系统内原子 os.replace，而单文件 bind 不行。
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      edge:
        ipv4_address: "${BOT_WEB_IP:-172.30.255.3}"
      backend:
        ipv4_address: "${BOT_BACKEND_IP:-172.30.254.3}"

  netease-api:
    image: moefurina/ncm-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "3000"
    networks:
      backend:
        ipv4_address: "${BOT_NETEASE_IP:-172.30.254.4}"

volumes:
  redis-data:

networks:
  edge:
    ipam:
      config:
        - subnet: "${BOT_EDGE_SUBNET:-172.30.255.0/24}"
  backend:
    ipam:
      config:
        - subnet: "${BOT_BACKEND_SUBNET:-172.30.254.0/24}"
