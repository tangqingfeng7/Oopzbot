<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Agora Player</title>
</head>
<body>
<script>
/**
 * Oopz voice browser backend page.
 *
 * Important mapping observed from the real client:
 * - Agora Web SDK joins with mode="live", role="host", codec="vp8".
 * - Oopz voice API data.supplierSign is the play_urlAgora token/channel_key.
 * - Oopz voice API data.roomId is the Agora channelName.
 * - The Oopz API data.appId may be 0; do not use it as Agora app id.
 * - data_stream payload uses:
 *     uid = Oopz internal string uid, e.g. 6ad0261bc4eb41e882692531981a0972
 *     cid = Agora numeric uid returned/used by join, e.g. 374010679
 *     m   = mic muted flag: 0 active, 1 muted
 *     hm  = speaker/deafen flag: 0 normal, 1 muted/deafened
 */

/* -------------------- WebSocket capture for data_stream bridge -------------------- */

const _wsInstances = [];
const _OrigWS = window.WebSocket;

window.WebSocket = function(url, protocols) {
  const ws = protocols ? new _OrigWS(url, protocols) : new _OrigWS(url);
  _wsInstances.push(ws);

  ws.addEventListener("open", () => {
    console.log("[WS open]", url);
  });

  ws.addEventListener("close", (ev) => {
    console.log("[WS close]", url, ev.code, ev.reason);
  });

  ws.addEventListener("error", () => {
    console.log("[WS error]", url);
  });

  return ws;
};

window.WebSocket.prototype = _OrigWS.prototype;
window.WebSocket.CONNECTING = _OrigWS.CONNECTING;
window.WebSocket.OPEN = _OrigWS.OPEN;
window.WebSocket.CLOSING = _OrigWS.CLOSING;
window.WebSocket.CLOSED = _OrigWS.CLOSED;

function getAgoraSignalWs() {
  const edgeWs = _wsInstances.find((w) =>
    w.readyState === WebSocket.OPEN &&
    typeof w.url === "string" &&
    w.url.includes("edge.sd-rtn.com")
  );

  if (edgeWs) return edgeWs;
  return _wsInstances.find((w) => w.readyState === WebSocket.OPEN) || null;
}

async function waitForAgoraSignalWs(timeoutMs = 3000) {
  const start = performance.now();

  while (performance.now() - start < timeoutMs) {
    const ws = getAgoraSignalWs();
    if (ws) return ws;
    await new Promise((resolve) => setTimeout(resolve, 50));
  }

  return null;
}

window.agoraWsUrls = () => _wsInstances.map((w) => ({
  url: w.url,
  readyState: w.readyState,
}));

/* -------------------- Agora SDK loader -------------------- */

async function loadAgoraSdk() {
  if (typeof AgoraRTC !== "undefined") return;

  const sdkUrl =
    window.AGORA_SDK_URL ||
    "https://download.agora.io/sdk/release/AgoraRTC_N.js";

  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = sdkUrl;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error(`failed to load Agora SDK: ${sdkUrl}`));
    document.head.appendChild(script);
  });
}

/* -------------------- Audio decode context -------------------- */

let decodeAudioContext = null;

function getDecodeAudioContext() {
  if (!decodeAudioContext) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) {
      throw new Error("AudioContext is not supported in this browser");
    }
    decodeAudioContext = new Ctx();
  }
  return decodeAudioContext;
}

async function decodeBase64ToAudioBuffer(base64Data) {
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  const arrayBuffer = bytes.buffer.slice(
    bytes.byteOffset,
    bytes.byteOffset + bytes.byteLength
  );

  const audioContext = getDecodeAudioContext();
  return await audioContext.decodeAudioData(arrayBuffer);
}

/* -------------------- Global runtime state -------------------- */

let client = null;
let _state = "idle";
let _playGen = 0;
let _currentVolume = 100;

let currentAgoraUid = null;
let currentOopzUid = null;
let currentMicMuted = false;
let currentSpeakerMuted = false;

let activePlayback = null;

window.agoraReady = () => typeof AgoraRTC !== "undefined";
window.agoraWarmup = async () => {
  try {
    await loadAgoraSdk();
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};
window.agoraState = () => _state;

function setState(nextState) {
  _state = nextState;
}

function shortId() {
  return Math.random().toString(16).slice(2, 8).padEnd(6, "0");
}

function getCurrentTrack() {
  return activePlayback ? activePlayback.track : null;
}

function isCurrentPlayback(playback) {
  return !!playback &&
    !!activePlayback &&
    playback.gen === activePlayback.gen &&
    playback.track === activePlayback.track;
}

/* -------------------- Voice state bridge -------------------- */

function buildVoiceStatePayload(oopzUid, agoraUid, micMuted, speakerMuted) {
  return {
    m: micMuted ? 1 : 0,
    uid: String(oopzUid),
    cid: Number(agoraUid),
    hm: speakerMuted ? 1 : 0,
  };
}

async function sendVoiceStateRaw(oopzUid, agoraUid, micMuted, speakerMuted, repeat = 2) {
  if (!oopzUid) {
    return { ok: false, error: "oopzUid is required" };
  }

  if (agoraUid === null || agoraUid === undefined || Number.isNaN(Number(agoraUid))) {
    return { ok: false, error: "valid agoraUid is required" };
  }

  try {
    const statePayload = buildVoiceStatePayload(
      oopzUid,
      agoraUid,
      micMuted,
      speakerMuted
    );

    // AgoraRTC_N.js exposes sendStreamMessage on the live client. Use it so
    // the SDK assigns the correct signaling request id/timestamp and waits for
    // the gateway acknowledgement. Writing JSON straight to the captured
    // WebSocket can appear successful locally while Oopz never receives the
    // identity, which leaves audio audible but removes the bot from the voice
    // member list shortly afterwards.
    if (client && typeof client.sendStreamMessage === "function") {
      const message = JSON.stringify(statePayload);
      for (let i = 0; i < repeat; i++) {
        await client.sendStreamMessage({
          payload: message,
          syncWithAudio: false,
        });
      }
      console.log("[voice state]", statePayload, "transport=agora-client");
      return {
        ok: true,
        transport: "agora-client",
        payload: statePayload,
      };
    }

    // Compatibility fallback for older SDK builds that do not expose the
    // client method. A failed native send must not fall through here: its
    // exception is returned to Python so Voice.join can roll the join back.
    const ws = await waitForAgoraSignalWs(3000);
    if (!ws) {
      return { ok: false, error: "no native data stream API or open agora ws" };
    }

    const payload = btoa(JSON.stringify(statePayload));
    const sendTs = Math.floor(performance.now());

    for (let i = 0; i < repeat; i++) {
      ws.send(
        JSON.stringify({
          _id: shortId(),
          _type: "data_stream",
          _message: {
            payload,
            syncWithAudio: false,
            sendTs: sendTs + i * 2,
          },
        })
      );
    }

    console.log("[voice state]", statePayload, "ws=", ws.url);

    return {
      ok: true,
      transport: "raw-websocket-fallback",
      ws: ws.url,
      payload: statePayload,
    };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
}

async function sendCurrentVoiceState(repeat = 2) {
  if (!currentOopzUid || currentAgoraUid === null || currentAgoraUid === undefined) {
    return {
      ok: false,
      error: "voice identity is not ready",
      currentOopzUid,
      currentAgoraUid,
    };
  }

  return await sendVoiceStateRaw(
    currentOopzUid,
    currentAgoraUid,
    currentMicMuted,
    currentSpeakerMuted,
    repeat
  );
}

window.agoraSetVoiceIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  currentOopzUid = oopzUid || currentOopzUid;

  if (agoraUid !== undefined && agoraUid !== null) {
    currentAgoraUid = Number(agoraUid);
  }

  return await sendCurrentVoiceState(2);
};

window.agoraSetVoiceState = async (micMuted, speakerMuted = currentSpeakerMuted) => {
  currentMicMuted = !!micMuted;
  currentSpeakerMuted = !!speakerMuted;
  return await sendCurrentVoiceState(2);
};

// Compatibility with older Python calls.
window.agoraSendIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  currentOopzUid = oopzUid || currentOopzUid;

  if (agoraUid !== undefined && agoraUid !== null) {
    currentAgoraUid = Number(agoraUid);
  }

  return await sendCurrentVoiceState(2);
};

/* -------------------- Track cleanup helpers -------------------- */

async function unpublishTrackSafely(track) {
  if (!track || !client) return;
  try {
    await client.unpublish([track]);
  } catch (_) {}
}

function closeTrackSafely(track) {
  if (!track) return;
  try {
    track.close();
  } catch (_) {}
}

function stopProcessAudioBufferSafely(track) {
  if (!track) return;
  try {
    track.stopProcessAudioBuffer();
  } catch (_) {}
}

function disposeStreamingMedia(playback) {
  const media = playback?.media;
  if (media) {
    try {
      media.pause();
    } catch (_) {}
    try {
      media.removeAttribute("src");
      media.load();
      media.remove();
    } catch (_) {}
  }

  try {
    playback?.mediaSource?.disconnect();
  } catch (_) {}
  try {
    playback?.mediaDestination?.disconnect();
  } catch (_) {}
  try {
    playback?.mediaStreamTrack?.stop();
  } catch (_) {}
  try {
    void playback?.audioContext?.close();
  } catch (_) {}
}

async function cleanupPlaybackResources(
  playback,
  { stopProcessing = true, unpublish = true } = {}
) {
  if (!playback) return;

  const { track } = playback;

  if (stopProcessing) {
    stopProcessAudioBufferSafely(track);
  }

  disposeStreamingMedia(playback);

  if (unpublish) {
    await unpublishTrackSafely(track);
  }

  closeTrackSafely(track);
}

async function stopCurrentPlayback({ bumpGen = true, nextState = "joined" } = {}) {
  const playback = activePlayback;

  if (bumpGen) {
    _playGen += 1;
  }

  activePlayback = null;

  if (playback) {
    await cleanupPlaybackResources(playback, {
      stopProcessing: true,
      unpublish: true,
    });
  }

  setState(nextState);
}

async function finalizeStoppedPlayback(playback) {
  if (!isCurrentPlayback(playback)) {
    return;
  }

  activePlayback = null;

  await cleanupPlaybackResources(playback, {
    stopProcessing: false,
    unpublish: true,
  });

  if (playback.gen === _playGen) {
    setState("joined");
  }
}

function bindPlaybackEvents(playback) {
  const { track, gen, media } = playback;

  if (media) {
    media.addEventListener("playing", () => {
      if (!isCurrentPlayback(playback) || gen !== _playGen) return;
      setState("playing");
    });
    media.addEventListener("pause", () => {
      if (!isCurrentPlayback(playback) || gen !== _playGen || media.ended) return;
      setState("paused");
    });
    media.addEventListener("ended", () => {
      if (!isCurrentPlayback(playback) || gen !== _playGen) return;
      setState("finished");
      void finalizeStoppedPlayback(playback);
    });
    media.addEventListener("error", () => {
      if (!isCurrentPlayback(playback) || gen !== _playGen) return;
      console.error("[streaming media error]", media.error?.message || media.error?.code);
      setState("finished");
      void finalizeStoppedPlayback(playback);
    });
    return;
  }

  track.on("source-state-change", (st) => {
    if (!isCurrentPlayback(playback)) return;
    if (gen !== _playGen) return;

    console.log("[source-state-change]", st);

    if (st === "playing") {
      setState("playing");
      return;
    }

    if (st === "paused") {
      setState("paused");
      return;
    }

    if (st === "stopped") {
      setState("finished");
      void finalizeStoppedPlayback(playback);
    }
  });
}

function makePlayback(track, streamingResources = {}) {
  return {
    gen: _playGen,
    track,
    ...streamingResources,
  };
}

function waitForMediaCanPlay(media, gen, timeoutMs = 12000) {
  if (media.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = (error = null) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      clearInterval(supersededCheck);
      media.removeEventListener("canplay", onCanPlay);
      media.removeEventListener("error", onError);
      error ? reject(error) : resolve();
    };
    const onCanPlay = () => finish();
    const onError = () => finish(new Error(
      `streaming media failed: ${media.error?.message || media.error?.code || "unknown"}`
    ));
    const timeout = setTimeout(
      () => finish(new Error("streaming media initial buffer timed out")),
      timeoutMs
    );
    const supersededCheck = setInterval(() => {
      if (gen !== _playGen) finish(new Error("superseded"));
    }, 50);

    media.addEventListener("canplay", onCanPlay, { once: true });
    media.addEventListener("error", onError, { once: true });
  });
}

/* -------------------- Join / Leave -------------------- */

window.agoraJoin = async (appId, token, channelName, uid) => {
  try {
    await loadAgoraSdk();

    if (client) {
      await window.agoraLeave();
    }

    client = AgoraRTC.createClient({
      mode: "live",
      codec: "vp8",
    });

    await client.setClientRole("host");

    const expectedUid = uid === null || uid === undefined ? null : Number(uid);

    const assignedUid = await client.join(
      String(appId),
      String(channelName),
      token || null,
      expectedUid
    );

    currentAgoraUid = Number(assignedUid);

    if (expectedUid !== null && currentAgoraUid !== expectedUid) {
      console.warn(
        "[Agora uid mismatch]",
        "expected=", expectedUid,
        "assigned=", currentAgoraUid
      );
    }
    setState("joined");

    return {
      ok: true,
      uid: currentAgoraUid,
    };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraLeave = async () => {
  await stopCurrentPlayback({ bumpGen: true, nextState: "joined" });

  if (client) {
    try {
      await client.leave();
    } catch (_) {}
    client = null;
  }

  currentAgoraUid = null;
  setState("idle");
};

/* -------------------- Playback core -------------------- */

async function publishTrackAsPlayback(localTrack, gen) {
  if (gen !== _playGen) {
    closeTrackSafely(localTrack);
    return { ok: false, error: "superseded" };
  }

  const playback = makePlayback(localTrack);
  activePlayback = playback;
  bindPlaybackEvents(playback);

  // Every song uses a newly-created Agora track. Apply the persisted volume
  // before audio starts so the first samples do not play at the SDK default.
  localTrack.setVolume(_currentVolume);
  localTrack.startProcessAudioBuffer({ loop: false });
  await client.publish([localTrack]);

  // After publish, refresh identity/state again. This matches the real client more closely.
  // publish 成功后，补发一次 uid/cid + 当前 m/hm 状态。
  // 此时 Agora signaling WS 通常已经存在。
  await sendCurrentVoiceState(2);

  if (!isCurrentPlayback(playback) || gen !== _playGen) {
    await cleanupPlaybackResources(playback, {
      stopProcessing: true,
      unpublish: true,
    });
    return { ok: false, error: "superseded" };
  }

  setState("playing");

  return {
    ok: true,
    duration: localTrack.duration,
    agoraUid: currentAgoraUid,
  };
}

async function publishStreamingUrlAsPlayback(url, gen) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    throw new Error("AudioContext is not supported in this browser");
  }

  const media = document.createElement("audio");
  media.crossOrigin = "anonymous";
  media.preload = "auto";
  media.playsInline = true;
  media.src = url;
  media.style.display = "none";
  document.body.appendChild(media);

  const audioContext = new Ctx({ latencyHint: "playback" });
  const mediaSource = audioContext.createMediaElementSource(media);
  const mediaDestination = audioContext.createMediaStreamDestination();
  mediaSource.connect(mediaDestination);

  const mediaStreamTrack = mediaDestination.stream.getAudioTracks()[0];
  if (!mediaStreamTrack) {
    throw new Error("streaming media did not create an audio track");
  }

  const localTrack = AgoraRTC.createCustomAudioTrack({ mediaStreamTrack });
  const playback = makePlayback(localTrack, {
    media,
    audioContext,
    mediaSource,
    mediaDestination,
    mediaStreamTrack,
  });

  try {
    media.load();
    await waitForMediaCanPlay(media, gen);

    if (gen !== _playGen) {
      throw new Error("superseded");
    }

    activePlayback = playback;
    bindPlaybackEvents(playback);
    localTrack.setVolume(_currentVolume);
    await client.publish([localTrack]);
    await sendCurrentVoiceState(2);

    if (!isCurrentPlayback(playback) || gen !== _playGen) {
      throw new Error("superseded");
    }

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }
    await media.play();
    setState("playing");

    return {
      ok: true,
      duration: Number.isFinite(media.duration) ? media.duration : 0,
      agoraUid: currentAgoraUid,
      streaming: true,
    };
  } catch (error) {
    if (isCurrentPlayback(playback)) {
      activePlayback = null;
    }
    await cleanupPlaybackResources(playback, {
      stopProcessing: false,
      unpublish: true,
    });
    throw error;
  }
}

window.agoraPlayAudio = async (url) => {
  const gen = ++_playGen;

  try {
    await loadAgoraSdk();

    if (!client) {
      return { ok: false, error: "not joined" };
    }

    await stopCurrentPlayback({ bumpGen: false, nextState: "joined" });
    return await publishStreamingUrlAsPlayback(url, gen);
  } catch (e) {
    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }
    setState(client ? "joined" : "idle");
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraPlayLocal = async (base64Data, mimeType) => {
  const gen = ++_playGen;
  let localTrack = null;

  try {
    await loadAgoraSdk();

    if (!client) {
      return { ok: false, error: "not joined" };
    }

    await stopCurrentPlayback({ bumpGen: false, nextState: "joined" });

    const audioBuffer = await decodeBase64ToAudioBuffer(base64Data);

    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }

    localTrack = await AgoraRTC.createBufferSourceAudioTrack({
      source: audioBuffer,
      cacheOnlineFile: false,
    });

    return await publishTrackAsPlayback(localTrack, gen);
  } catch (e) {
    if (localTrack) {
      await cleanupPlaybackResources({ gen, track: localTrack }, {
        stopProcessing: true,
        unpublish: true,
      });
    }

    if (activePlayback && activePlayback.track === localTrack) {
      activePlayback = null;
    }

    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }

    setState(client ? "joined" : "idle");
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraStopAudio = async () => {
  await stopCurrentPlayback({ bumpGen: true, nextState: "joined" });
};

/* -------------------- Playback controls -------------------- */

window.agoraPause = async () => {
  const track = getCurrentTrack();
  if (!track || _state !== "playing") {
    return { ok: false, error: "not playing" };
  }

  try {
    if (activePlayback?.media) {
      activePlayback.media.pause();
    } else {
      track.pauseProcessAudioBuffer();
    }
    setState("paused");
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraResume = async () => {
  const track = getCurrentTrack();
  if (!track || _state !== "paused") {
    return { ok: false, error: "not paused" };
  }

  try {
    if (activePlayback?.media) {
      await activePlayback.media.play();
    } else {
      track.resumeProcessAudioBuffer();
    }
    setState("playing");
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraSeek = (time) => {
  const track = getCurrentTrack();
  if (!track) {
    return { ok: false, error: "no track" };
  }

  try {
    if (activePlayback?.media) {
      activePlayback.media.currentTime = Math.max(0, Number(time) || 0);
    } else {
      track.seekAudioBuffer(time);
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraSetVolume = (vol) => {
  const parsed = Number(vol);
  if (!Number.isFinite(parsed)) {
    return { ok: false, error: "invalid volume" };
  }

  _currentVolume = Math.max(0, Math.min(100, parsed));
  const track = getCurrentTrack();
  if (!track) {
    // Joining the voice channel happens before the first audio track exists.
    // Keep the value so publishTrackAsPlayback can apply it to that track.
    return { ok: true, pending: true, volume: _currentVolume };
  }

  try {
    track.setVolume(_currentVolume);
    return { ok: true, volume: _currentVolume };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraGetCurrentTime = () => {
  const track = getCurrentTrack();
  if (!track) return 0;

  try {
    return activePlayback?.media
      ? activePlayback.media.currentTime
      : track.getCurrentTime();
  } catch (_) {
    return 0;
  }
};

/* -------------------- Debug status -------------------- */

window.agoraGetStatus = () => {
  const track = getCurrentTrack();

  let currentTime = 0;
  let duration = 0;

  try {
    currentTime = activePlayback?.media
      ? activePlayback.media.currentTime
      : (track ? track.getCurrentTime() : 0);
  } catch (_) {}

  try {
    duration = activePlayback?.media
      ? (Number.isFinite(activePlayback.media.duration) ? activePlayback.media.duration : 0)
      : (track ? track.duration : 0);
  } catch (_) {}

  return {
    state: _state,
    hasClient: !!client,
    currentOopzUid,
    currentAgoraUid,
    currentMicMuted,
    currentSpeakerMuted,
    currentVolume: _currentVolume,
    hasTrack: !!track,
    currentTime,
    duration,
    ws: window.agoraWsUrls(),
  };
};
</script>
</body>
</html>
