      <section id="panel" class="hidden table-stack">
        <article class="surface-card">
          <div class="action-row" style="flex-wrap:wrap">
            <span id="areaState" class="micro-status is-warning">等待同步</span>
            <div id="areaTabs" class="area-tabs" role="tablist"></div>
            <select id="areaPicker" class="m-area-select" data-change="area-change" hidden>
              <option value="">加载中...</option>
            </select>
            <button class="btn btn-ghost" type="button" data-action="refresh-areas">刷新</button>
            <button id="leaveAreaBtn" class="btn btn-danger" type="button" data-action="leave-current-area" disabled>退出当前域</button>
          </div>
        </article>

        <!-- 私信域邀请审批 -->
        <article class="table-card" id="areaInviteCard">
          <div class="section-head">
            <div>
              <h3 class="section-title">待处理域邀请</h3>
              <p class="a-invite-copy">Bot 从收到的私信中自动识别；只有管理员同意后才会加入域。</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" data-action="refresh-area-invites">刷新</button>
          </div>
          <div class="a-invite-body">
            <div id="areaInviteList" class="a-invite-list">
              <div class="empty-state">暂无待处理的私信域邀请</div>
            </div>
            <div id="areaInviteMsg" class="msg"></div>
          </div>
        </article>

        <!-- 域配置卡片 -->
        <article class="table-card" id="areaConfigCard">
          <div class="section-head">
            <h3 class="section-title">域配置</h3>
            <div class="action-row" style="gap:6px">
              <button class="btn btn-primary btn-sm" type="button" data-action="save-area-config">保存配置</button>
              <button class="btn btn-danger btn-sm" type="button" data-action="delete-area-config">删除配置</button>
            </div>
          </div>
          <div class="field-grid" style="padding:16px 20px">
            <div class="field field--wide"><label for="ac_name">域名称</label><input id="ac_name" type="text" placeholder="仅日志显示" /></div>
            <div class="field field--wide">
              <label for="ac_default_channel_select">默认频道</label>
              <select id="ac_default_channel_select" data-change="default-channel-change">
                <option value="">先选择域后加载频道</option>
              </select>
            </div>
            <div class="field field--wide">
              <label for="ac_auto_role_select">自动分配身份组</label>
              <select id="ac_auto_role_select" data-change="auto-role-change">
                <option value="">先选择域后加载身份组</option>
              </select>
            </div>
            <input id="ac_default_channel" type="hidden" />
            <input id="ac_auto_role_id" type="hidden" />
            <input id="ac_auto_role_name" type="hidden" />
            <div class="field field--wide">
              <label>允许发起屏幕共享的身份组</label>
              <div id="ac_screen_share_roles" class="a-am-grid"><span class="a-am-empty">先选择域后加载身份组</span></div>
              <small style="color:var(--ink-faint)">域主和 Bot 管理员始终允许；其他成员需命中所选 roleID。</small>
            </div>
            <div class="field field--wide"><label for="ac_welcome">入域欢迎消息</label><input id="ac_welcome" type="text" placeholder="欢迎 {name} 加入～" /></div>
            <div class="field field--wide"><label for="ac_leave">退域消息</label><input id="ac_leave" type="text" placeholder="留空继承全局退域消息" /></div>
            <div class="field field--wide"><label for="ac_admin_uids">管理员 UID（逗号分隔）</label><input id="ac_admin_uids" type="text" placeholder="空则继承全局" /></div>
            <div class="field field--wide"><label for="ac_plugins_enabled">启用插件（逗号分隔，空=全部）</label><input id="ac_plugins_enabled" type="text" /></div>
            <div class="field field--wide"><label for="ac_plugins_disabled">禁用插件（逗号分隔）</label><input id="ac_plugins_disabled" type="text" /></div>
            <div class="field field--wide">
              <label for="ac_announcement_style">公告样式（IMPORTANT）</label>
              <select id="ac_announcement_style">
                <option value="">跟随全局默认（config.py）</option>
                <option value="true">该域强制开启</option>
                <option value="false">该域强制关闭</option>
              </select>
            </div>
          </div>
          <div id="areaConfigMsg" class="msg" style="padding:0 20px 12px"></div>
        </article>

        <!-- 频道列表 -->
        <article class="table-card" id="channelsCard">
          <div class="section-head">
            <h3 class="section-title">频道列表</h3>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="a-id-label">域 ID: <code id="areaIdDisplay" class="a-id-code">-</code></span>
              <button class="btn btn-ghost btn-sm" type="button" data-action="show-create-channel">创建频道</button>
            </div>
          </div>
          <div class="table-shell">
            <table>
              <thead>
                <tr>
                  <th>频道名称 / ID</th>
                  <th>分组</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="channelRows">
                <tr><td colspan="5" class="empty-state">暂无数据</td></tr>
              </tbody>
            </table>
          </div>
        </article>

        <!-- 语音频道在线 -->
        <article class="table-card" id="voiceCard">
          <div class="section-head">
            <h3 class="section-title">语音频道监控</h3>
            <button class="btn btn-ghost btn-sm" type="button" data-action="load-voice-channels">刷新</button>
          </div>
          <div id="voiceList" class="a-voice-list">
            <p class="empty-state">暂无语音频道数据</p>
          </div>
        </article>

        <!-- 创建频道对话框 -->
        <div id="chModalOverlay" class="m-modal-overlay" data-action="close-ch-modal"></div>
        <div id="chModalDialog" class="m-modal">
          <header class="m-modal__head">
            <h3 class="m-modal__title">创建频道</h3>
            <button class="m-modal__close" type="button" data-action="close-ch-modal" aria-label="关闭">&times;</button>
          </header>
          <div class="m-modal__body">
            <div class="field"><label for="newChName">频道名称</label><input id="newChName" type="text" placeholder="输入频道名称" /></div>
            <div class="field">
              <label for="newChType">频道类型</label>
              <select id="newChType">
                <option value="text">文字频道</option>
                <option value="voice">语音频道</option>
              </select>
            </div>
            <div id="createChMsg" class="msg"></div>
          </div>
          <footer class="m-modal__foot">
            <button class="btn btn-ghost" type="button" data-action="close-ch-modal">取消</button>
            <button class="btn btn-primary" type="button" data-action="do-create-channel">创建</button>
          </footer>
        </div>

        <!-- 编辑频道对话框 -->
        <div id="editChOverlay" class="m-modal-overlay" data-action="close-edit-channel"></div>
        <div id="editChDialog" class="m-modal" style="width:min(520px,92vw)">
          <header class="m-modal__head">
            <h3 id="editChTitle" class="m-modal__title">编辑频道</h3>
            <button class="m-modal__close" type="button" data-action="close-edit-channel" aria-label="关闭">&times;</button>
          </header>
          <div class="m-modal__body">
            <input id="editChId" type="hidden" />
            <div class="field-grid">
              <div class="field field--wide">
                <label for="editChName">频道名称</label>
                <input id="editChName" type="text" placeholder="频道名称" />
              </div>
              <div class="field">
                <label for="editChMaxMember">人数上限</label>
                <input id="editChMaxMember" type="number" min="1" max="100000" />
              </div>
              <div class="field">
                <label for="editChTextGap">慢速模式（秒）</label>
                <input id="editChTextGap" type="number" min="0" max="3600" />
              </div>
              <div class="field" id="editChQualityWrap">
                <label for="editChVoiceQuality">语音质量</label>
                <select id="editChVoiceQuality">
                  <option value="32k">32k</option>
                  <option value="64k">64k</option>
                  <option value="128k">128k</option>
                </select>
              </div>
              <div class="field" id="editChDelayWrap">
                <label for="editChVoiceDelay">语音延迟</label>
                <select id="editChVoiceDelay">
                  <option value="LOW">低</option>
                  <option value="NORMAL">普通</option>
                  <option value="HIGH">高</option>
                </select>
              </div>
              <div class="field field--check">
                <label><input id="editChSecret" type="checkbox" data-change="toggle-secret-panel" /> 私密频道</label>
              </div>
              <div class="field field--check">
                <label><input id="editChHasPassword" type="checkbox" data-change="toggle-edit-pwd" /> 启用密码</label>
              </div>
              <div class="field field--wide" id="editChPwdWrap" style="display:none">
                <label for="editChPassword">频道密码</label>
                <input id="editChPassword" type="text" placeholder="设置频道密码" />
              </div>
            </div>
            <!-- 私密频道成员管理 -->
            <div id="editChAccessWrap" style="display:none;margin-top:12px">
              <div class="a-am-section">
                <label class="a-am-label">可访问成员（在线）</label>
                <div class="a-am-hint">勾选的成员可进入此频道，Bot 和管理员会自动添加</div>
                <div id="editChAccessList" class="a-am-grid">
                  <span class="a-am-empty">当前无在线成员</span>
                </div>
              </div>
            </div>
            <div id="editChMsg" class="msg" style="margin-top:12px"></div>
          </div>
          <footer class="m-modal__foot">
            <button class="btn btn-ghost" type="button" data-action="close-edit-channel">取消</button>
            <button class="btn btn-primary" type="button" data-action="do-save-channel-settings">保存</button>
          </footer>
        </div>

        <!-- 语音调度对话框 -->
        <div id="dispatchOverlay" class="m-modal-overlay" data-action="close-dispatch"></div>
        <div id="dispatchDialog" class="m-modal" style="width:min(420px,92vw)">
          <header class="m-modal__head">
            <h3 class="m-modal__title">调度用户</h3>
            <button class="m-modal__close" type="button" data-action="close-dispatch" aria-label="关闭">&times;</button>
          </header>
          <div class="m-modal__body">
            <input id="dispatchUid" type="hidden" />
            <input id="dispatchFrom" type="hidden" />
            <p id="dispatchInfo" class="a-dispatch-info"></p>
            <div class="field">
              <label for="dispatchTarget">目标语音频道</label>
              <select id="dispatchTarget"></select>
            </div>
            <div id="dispatchMsg" class="msg"></div>
          </div>
          <footer class="m-modal__foot">
            <button class="btn btn-ghost" type="button" data-action="close-dispatch">取消</button>
            <button class="btn btn-primary" type="button" data-action="do-dispatch">调度</button>
          </footer>
        </div>

        <!-- 邀请审批等操作共用的确认弹窗 -->
        <div id="modalOverlay" class="m-modal-overlay" data-action="close-modal"></div>
        <div id="modalDialog" class="m-modal">
          <header class="m-modal__head">
            <h3 id="modalTitle" class="m-modal__title">操作</h3>
            <button class="m-modal__close" type="button" data-action="close-modal" aria-label="关闭">&times;</button>
          </header>
          <div id="modalBody" class="m-modal__body"></div>
          <footer id="modalFooter" class="m-modal__foot"></footer>
        </div>
      </section>

      <style>
        .m-area-select {
          min-height: 34px;
          padding-top: 0;
          padding-bottom: 0;
          font-size: 13px;
          font-weight: 600;
          max-width: 200px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .a-voice-list { padding: 16px 20px; }
        .a-invite-copy { margin: 4px 0 0; color: var(--ink-faint); font-size: 12px; }
        .a-invite-body { padding: 16px 20px 20px; }
        .a-invite-list { display: grid; gap: 12px; }
        .a-invite-item {
          display: grid;
          grid-template-columns: minmax(220px, 320px) minmax(220px, 1fr);
          gap: 16px;
          padding: 14px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: var(--paper);
        }

        .a-invite-avatar {
          position: absolute;
          left: 12px;
          bottom: -8px;
          width: 52px;
          height: 52px;
          border: 3px solid var(--paper-strong);
          border-radius: 12px;
          object-fit: cover;
          background: var(--surface);
        }
        .a-invite-detail { display: flex; flex-direction: column; justify-content: center; gap: 7px; min-width: 0; }
        .a-invite-detail strong { font-size: 17px; }
        .a-invite-detail span { color: var(--ink-soft); font-size: 13px; overflow-wrap: anywhere; }
        .a-invite-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        @media (max-width: 720px) {
          .a-invite-item { grid-template-columns: 1fr; }
        }
        .a-voice-ch {
          padding: 12px 0;
          border-bottom: 1px solid var(--line);
        }

          display: flex; align-items: center; gap: 8px;
          margin-bottom: 8px;
        }
        .a-voice-ch__name { font-weight: 700; font-size: 14px; }
        .a-voice-ch__group { font-size: 12px; color: var(--ink-faint); }
        .a-voice-ch__count {
          font-size: 11px; font-weight: 600;
          padding: 2px 8px; border-radius: 99px;
          background: var(--bg-soft); color: var(--ink-soft);
        }
        .a-voice-users {
          display: flex; flex-wrap: wrap; gap: 10px;
        }

          display: inline-flex; align-items: center; gap: 10px;
          font-size: 13px; padding: 8px 10px 8px 8px;
          border-radius: 12px; background: var(--bg-soft);
          border: 1px solid var(--line);
          transition: border-color .15s, box-shadow .15s, transform .12s;
        }
        .a-voice-user:hover {
          border-color: var(--accent, #d4a058);
          box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
          transform: translateY(-1px);
        }
        .a-voice-user__ava { position: relative; flex-shrink: 0; line-height: 0; }
        .a-voice-user__avatar {
          width: 36px; height: 36px; border-radius: 50%;
          object-fit: cover; display: block;
          border: 1px solid var(--line);
        }

          display: flex; align-items: center; justify-content: center;
          background: var(--bg); color: var(--ink-faint);
          font-size: 15px; font-weight: 700; line-height: 36px;
        }
        .a-voice-user__dot {
          position: absolute; bottom: -1px; right: -1px;
          width: 11px; height: 11px; border-radius: 50%;
          background: var(--success, #5eead4);
          border: 2px solid var(--paper);
        }
        .a-voice-user__name {
          white-space: nowrap; font-weight: 600;
          max-width: 120px; overflow: hidden; text-overflow: ellipsis;

          flex-shrink: 0; padding: 4px 12px;
          font-size: 12px; font-weight: 700; line-height: 18px;

          border: 1px solid var(--accent, #d4a058);
          border-radius: 8px; transition: filter .15s, transform .1s;
        }
        .a-voice-user__move:hover { filter: brightness(1.08); }
        .a-voice-user__move:active { transform: scale(.96); }
        .a-dispatch-info { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.5; }
        .a-ch-actions { display: flex; gap: 4px; }
        .a-ch-actions .btn { padding: 2px 10px; font-size: 11px; min-height: 28px; border-radius: 7px; }
        #channelRows tr { transition: background .12s ease; }
        #channelRows tr:hover { background: var(--bg-soft); }
        .a-ch-type {
          display: inline-block; font-size: 11px; font-weight: 600;
          padding: 2px 8px; border-radius: 6px;
          background: var(--bg-soft); color: var(--ink-soft);
          border: 1px solid var(--line);
        }

        .a-ch-type--text { background: rgba(94, 234, 212, 0.1); color: #5eead4; border-color: rgba(94, 234, 212, 0.2); }
        .a-ch-type--secret { background: rgba(251, 146, 60, 0.12); color: #fb923c; border-color: rgba(251, 146, 60, 0.25); }
        .a-ch-id { font-size: 11px; color: var(--ink-faint); font-family: monospace; user-select: all; margin-top: 2px; }
        .a-id-label { font-size: 12px; color: var(--ink-soft); }
        .a-id-code {
          font-size: 11px; padding: 2px 6px; border-radius: 4px;
          background: var(--bg-soft); color: var(--ink); user-select: all;
          font-family: monospace;
        }
        .a-am-section { padding: 12px 0; }
        .a-am-label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 4px; }
        .a-am-hint { font-size: 11px; color: var(--ink-faint); margin-bottom: 8px; }
        .a-am-grid {
          display: flex; flex-wrap: wrap; gap: 6px;
          max-height: 160px; overflow-y: auto; padding: 4px 0;

        .a-am-empty { font-size: 12px; color: var(--ink-faint); line-height: 28px; }
        .a-am-item {
          display: inline-flex; align-items: center; gap: 6px;
          font-size: 12px; padding: 5px 10px; border-radius: 8px;
          background: var(--bg-soft); border: 1px solid var(--line);
          cursor: pointer; user-select: none; transition: border-color .15s, background .15s;
        }
        .a-am-item:hover { border-color: var(--ink-faint); }
        .a-am-item:has(input:checked) { border-color: var(--accent, #d4a058); background: rgba(212,160,88,.08); }
        .a-am-item input[type="checkbox"] { accent-color: var(--accent, #d4a058); margin: 0; }
        .a-am-dot {
          width: 6px; height: 6px; border-radius: 50%;
          background: #5eead4; flex-shrink: 0;
        }
        .a-am-name { white-space: nowrap; }
      </style>
