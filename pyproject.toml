[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["，", "。", "：", "；", "（", "）"]

[tool.pyright]
# basedpyright 也读这一段；两个工具的配置段不能同时存在，勿再添加 [tool.basedpyright]。
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["main.py", "src", "plugins", "tools", "tests"]
# 列出前两项是因为显式 exclude 会覆盖 pyright 的默认值。
exclude = ["**/node_modules", "**/__pycache__"]
