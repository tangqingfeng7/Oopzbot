name: Docker Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Compose and Nginx
        run: |
          docker compose config
          mkdir -p nginx/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem
          docker run --rm \
            --add-host bot:127.0.0.1 \
            --add-host netease-api:127.0.0.1 \
            -v "$PWD/nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t

      - name: Build image
        run: docker build --pull -t oopzbot:test .

      - name: Verify non-root Chromium runtime
        run: |
          docker run --rm -i --network none --shm-size=1g \
            -e PYTHONPATH=/app/src \
            --entrypoint python oopzbot:test - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from oopz_sdk.transport.voice_browser import _DEFAULT_BROWSER_ARGS

          assert os.getuid() == 1000, os.getuid()
          assert os.getgid() == 1000, os.getgid()
          assert os.environ["PLAYWRIGHT_BROWSERS_PATH"] == "/ms-playwright"
          assert Path.home() == Path("/home/bot"), Path.home()
          for variable in (
              "HOME",
              "XDG_CACHE_HOME",
              "XDG_CONFIG_HOME",
              "XDG_DATA_HOME",
              "XDG_RUNTIME_DIR",
          ):
              directory = Path(os.environ[variable])
              assert directory.is_dir(), (variable, directory)
              probe = directory / ".oopzbot-write-test"
              probe.write_text(variable, encoding="utf-8")
              probe.unlink()

          with sync_playwright() as playwright:
              launches = (
                  ("default-headless", {}),
                  ("chromium-channel", {"channel": "chromium"}),
              )
              for name, options in launches:
                  browser = playwright.chromium.launch(
                      headless=True,
                      args=list(_DEFAULT_BROWSER_ARGS),
                      **options,
                  )
                  page = browser.new_page()
                  page.set_content(f"<title>{name}</title>")
                  assert page.title() == name
                  browser.close()
          PY

      - name: Verify host bind-mount ownership override
        run: |
          # Debian 基础镜像已有 GID 100；自定义宿主 GID 与其重合也必须能构建。
          docker build \
            --build-arg BOT_UID=12345 \
            --build-arg BOT_GID=100 \
            -t oopzbot:existing-gid .
          docker run --rm --entrypoint sh oopzbot:existing-gid -c '
            test "$(id -u)" = 12345
            test "$(id -g)" = 100
          '

          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker build \
            --build-arg BOT_UID="$host_uid" \
            --build-arg BOT_GID="$host_gid" \
            -t oopzbot:host-id .

          bind_root="$(mktemp -d)"
          trap 'rm -rf "$bind_root"' EXIT
          mkdir -p "$bind_root/config" "$bind_root/data" "$bind_root/logs"
          cp config.example.py "$bind_root/config/runtime.py"
          cp private_key.example.py "$bind_root/config/private_key.py"

          docker run --rm -i \
            -e PYTHONPATH=/app/src \
            -e EXPECTED_UID="$host_uid" \
            -e EXPECTED_GID="$host_gid" \
            -v "$bind_root/config:/app/config" \
            -v "$bind_root/data:/app/data" \
            -v "$bind_root/logs:/app/logs" \
            --entrypoint python oopzbot:host-id - <<'PY'
          import os
          from pathlib import Path
          from web.web_player_config import persist_admin_uids

          assert os.getuid() == int(os.environ["EXPECTED_UID"])
          assert os.getgid() == int(os.environ["EXPECTED_GID"])
          assert Path("/app/config.py").is_symlink()
          assert Path("/app/private_key.py").is_symlink()
          assert Path("/app/config.py").resolve() == Path("/app/config/runtime.py")
          persist_admin_uids(["docker-ci"])
          assert "docker-ci" in Path("/app/config.py").read_text(encoding="utf-8")
          assert not Path("/app/config/runtime.py.tmp").exists()
          Path("/app/private_key.py").write_text("updated-key", encoding="utf-8")
          Path("/app/config/.write-test").write_text("config", encoding="utf-8")
          Path("/app/data/.write-test").write_text("data", encoding="utf-8")
          Path("/app/logs/.write-test").write_text("logs", encoding="utf-8")
          PY

          test "$(cat "$bind_root/config/.write-test")" = config
          test "$(cat "$bind_root/data/.write-test")" = data
          test "$(cat "$bind_root/logs/.write-test")" = logs
          grep -q docker-ci "$bind_root/config/runtime.py"
          test "$(cat "$bind_root/config/private_key.py")" = updated-key
          test "$(stat -c %u "$bind_root/data/.write-test")" = "$host_uid"
          test "$(stat -c %g "$bind_root/data/.write-test")" = "$host_gid"
