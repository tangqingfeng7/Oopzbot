name: Sync Oopz SDK

on:
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [sdk-released]
  workflow_dispatch:
    inputs:
      version:
        description: "目标 oopz-sdk 版本号（留空则自动获取 PyPI 最新版，例如 0.18.0）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-oopz-sdk
  cancel-in-progress: false

env:
  TARGET_BRANCH: dev
  SYNC_BRANCH: chore/sync-oopz-sdk

jobs:
  check:
    name: Check PyPI for new oopz-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      current: ${{ steps.resolve.outputs.current }}
      version: ${{ steps.resolve.outputs.version }}
      release_url: ${{ steps.resolve.outputs.release_url }}

    steps:
      - name: Checkout dev (shallow)
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_RELEASE_URL: ${{ github.event.client_payload.release_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          raw = (os.environ.get("INPUT_VERSION") or os.environ.get("DISPATCH_VERSION") or "").strip()
          raw = raw.lstrip("vV").strip()

          def fetch_json(url: str) -> dict | None:
              req = urllib.request.Request(url, headers={"User-Agent": "oopzbot-sync-sdk"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.status == 200:
                          return json.loads(resp.read().decode("utf-8"))
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  return None
              return None

          def extract_sdk_version(req_text: str) -> str:
              match = re.search(r"(?m)^oopz-sdk==([^\s#]+)", req_text)
              return match.group(1).strip() if match else ""

          if not raw:
              latest = fetch_json("https://pypi.org/pypi/oopz-sdk/json")
              if not latest or not latest.get("info", {}).get("version"):
                  raise SystemExit("无法从 PyPI 获取 oopz-sdk 最新版本号")
              version = str(latest["info"]["version"]).strip()
          else:
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+(?:[a-zA-Z0-9._-]+)?", raw):
                  raise SystemExit(f"非法版本号: {raw!r}")
              version = raw

          current = extract_sdk_version(Path("requirements.txt").read_text(encoding="utf-8"))
          if not current:
              raise SystemExit("requirements.txt 中未找到 oopz-sdk==<version>")

          release_url = (os.environ.get("DISPATCH_RELEASE_URL") or "").strip()
          if not release_url:
              release_url = f"https://github.com/tangqingfeng7/Oopzbot-SDK/releases/tag/v{version}"

          changed = current != version

          # 定时轮询时若已有同版本的未合并同步 PR，则跳过重复构建（手动触发仍可强制重跑）
          if changed and os.environ.get("EVENT_NAME") != "workflow_dispatch":
              sync_branch = os.environ["SYNC_BRANCH"]
              target_branch = os.environ["TARGET_BRANCH"]
              pr_proc = subprocess.run(
                  [
                      "gh", "pr", "list",
                      "--base", target_branch,
                      "--head", sync_branch,
                      "--state", "open",
                      "--json", "number",
                      "--jq", ".[0].number // empty",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if pr_proc.returncode == 0 and pr_proc.stdout.strip():
                  fetch_proc = subprocess.run(
                      ["git", "fetch", "--depth=1", "origin", sync_branch],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if fetch_proc.returncode == 0:
                      show_proc = subprocess.run(
                          ["git", "show", f"FETCH_HEAD:requirements.txt"],
                          capture_output=True,
                          text=True,
                          check=False,
                      )
                      if show_proc.returncode == 0 and extract_sdk_version(show_proc.stdout) == version:
                          print(f"已存在针对 oopz-sdk=={version} 的开放 PR #{pr_proc.stdout.strip()}，跳过重复同步")
                          changed = False

          if changed:
              # 等待 PyPI 索引同步刚发布的版本（最多 4 分钟）
              ready = False
              for attempt in range(1, 25):
                  meta = fetch_json(f"https://pypi.org/pypi/oopz-sdk/{version}/json")
                  if meta and meta.get("urls"):
                      ready = True
                      print(f"PyPI 已可见 oopz-sdk=={version}（第 {attempt} 次检查）")
                      break
                  print(f"等待 PyPI 索引 oopz-sdk=={version}（第 {attempt}/24 次）...")
                  time.sleep(10)
              if not ready:
                  raise SystemExit(f"等待超时：PyPI 尚未提供 oopz-sdk=={version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"current={current}\n")
              out.write(f"version={version}\n")
              out.write(f"changed={'true' if changed else 'false'}\n")
              out.write(f"release_url={release_url}\n")
          print(f"current={current}, target={version}, changed={changed}")
          PY

  sync:
    name: Sync oopz-sdk -> dev
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      BOT_REDIS_HOST: 127.0.0.1
      BOT_REDIS_PORT: "6379"
      BOT_DISABLE_AUTO_START_NETEASE: "1"

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Update requirements.txt
        env:
          TARGET_VERSION: ${{ needs.check.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["TARGET_VERSION"]
          req_path = Path("requirements.txt")
          text = req_path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^oopz-sdk==[^\s#]+",
              f"oopz-sdk=={version}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("更新 requirements.txt 失败")
          req_path.write_text(updated, encoding="utf-8")
          PY

      - name: Install dependencies and verify
        id: verify
        env:
          TARGET_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set +e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements-dev.txt
          INSTALL_RC=$?

          cp config.example.py config.py
          cp private_key.example.py private_key.py
          mkdir -p data logs

          VERIFY_RC=0
          if [ "$INSTALL_RC" -ne 0 ]; then
            VERIFY_RC=$INSTALL_RC
            echo "依赖安装失败 (exit=$INSTALL_RC)" > /tmp/verify.log
          else
            {
              python -c "import os, oopz_sdk; expected = os.environ['TARGET_VERSION']; actual = oopz_sdk.__version__; assert actual == expected, f'expected {expected}, got {actual}'; print('Verified oopz_sdk.__version__ =', actual)" &&
              python -m compileall -q main.py src plugins tools &&
              python -m unittest discover -s tests -p "test_*.py" -v
            } > /tmp/verify.log 2>&1
            VERIFY_RC=$?
          fi

          tail -n 60 /tmp/verify.log
          if [ "$VERIFY_RC" -eq 0 ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch and open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.check.outputs.current }}
          TARGET_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_URL: ${{ needs.check.outputs.release_url }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git add requirements.txt
          git commit -m "更新 oopz-sdk 至 ${TARGET_VERSION}"
          git push --force origin "$SYNC_BRANCH"

          TITLE="更新 oopz-sdk 至 ${TARGET_VERSION}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$VERIFY_STATUS" = "passed" ]; then
            STATUS_LINE="✅ 全量回归测试与语法检查通过（Python 3.10 + Redis）"
            DRAFT_FLAG=""
          else
            STATUS_LINE="⚠️ 回归测试未通过，已按草稿 PR 创建，请查看 [工作流日志](${RUN_URL}) 并适配新版本"
            DRAFT_FLAG="--draft"
          fi

          cat > /tmp/pr_body.md <<EOF
          自动同步上游 SDK 新版本：

          - **版本变更**：\`oopz-sdk\` \`${CURRENT_VERSION}\` → \`${TARGET_VERSION}\`
          - **上游发布**：${RELEASE_URL}
          - **验证状态**：${STATUS_LINE}
          - **工作流记录**：${RUN_URL}
          EOF

          EXISTING_PR="$(gh pr list --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file /tmp/pr_body.md
            if [ "$VERIFY_STATUS" = "passed" ]; then
              gh pr ready "$EXISTING_PR" || true
            else
              gh pr ready --undo "$EXISTING_PR" || true
            fi
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/pr_body.md \
              $DRAFT_FLAG
          fi

      - name: Fail job if verification failed
        if: steps.verify.outputs.status != 'passed'
        run: |
          echo "::error::oopz-sdk==${{ needs.check.outputs.version }} 回归测试未通过，已打开草稿 PR 供排查。"
          exit 1
