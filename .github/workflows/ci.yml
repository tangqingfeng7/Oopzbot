name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      BOT_REDIS_HOST: 127.0.0.1
      BOT_REDIS_PORT: "6379"
      BOT_DISABLE_AUTO_START_NETEASE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Prepare runtime config
        run: |
          cp config.example.py config.py
          cp private_key.example.py private_key.py
          mkdir -p data logs

      - name: Syntax check
        run: python -m compileall -q main.py src plugins tools

      - name: Incremental Ruff and Pyright
        if: matrix.python-version == '3.10'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          QUALITY_BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$QUALITY_BASE" ] || [ "$QUALITY_BASE" = "0000000000000000000000000000000000000000" ]; then
            QUALITY_BASE="$(git rev-parse HEAD^)"
          fi
          # 强制推送前的提交可能已不属于任何分支，完整 checkout 也不会拉取它。
          if ! git cat-file -e "${QUALITY_BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$QUALITY_BASE"
          fi
          python tools/check_incremental_quality.py --base "$QUALITY_BASE"

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
